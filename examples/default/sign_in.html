<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script>
    // Auth transfer in progress? Hide the page header before first paint; the
    // <sa-sign-in> component shows its own spinner while it exchanges the token.
    if (/[?&]token=/.test(location.search) || /[#&]token=/.test(location.hash))
      document.documentElement.classList.add('auth-transfer')
  </script>
  <script>
    // Hide page chrome when opened inside the SolarAssistant Android app.
    if (navigator.userAgent.includes('SolarAssistant'))
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('embedded')
        document.querySelectorAll('sa-sign-in, sa-sites, sa-user')
          .forEach(el => el.classList.add('embedded'))
      })
  </script>
  <script type="module" src="https://cdn.solar-assistant.io/js/solar-assistant.js"></script>
</head>
<body>
  <header class="site-header hide-android">
    <div class="header-inner">
      <a class="header-logo" href="/sign_in">
        <img src="/assets/logo.svg" alt="Your organization" />
      </a>
    </div>
  </header>
  <main class="centered">
    <h1>Sign in</h1>
    <!-- Replace YOUR_ORG_ID with your SolarAssistant organization id. -->
    <sa-sign-in organization-id="YOUR_ORG_ID" return-to="/sites"></sa-sign-in>
    <p class="page-note">Don't have an account? <a href="/register">Create one</a></p>
  </main>
</body>
</html>
