<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script>
    // Hide page chrome when opened inside the SolarAssistant Android app.
    if (navigator.userAgent.includes('SolarAssistant'))
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('embedded')
        document.querySelectorAll('sa-sign-in, sa-sites, sa-user')
          .forEach(el => el.classList.add('embedded'))
      })
  </script>
  <script type="module" src="https://cdn.solar-assistant.io/js/solar-assistant.js"></script>
</head>
<body>
  <header class="site-header hide-android">
    <div class="header-inner">
      <a class="header-logo" href="/sign_in">
        <img src="/assets/logo.svg" alt="Your organization" />
      </a>
    </div>
  </header>
  <main class="centered">
    <h1>Create account</h1>
    <!-- Replace YOUR_ORG_ID with your SolarAssistant organization id. -->
    <!-- You must also serve a /terms page — <sa-register> links to it. -->
    <sa-register organization-id="YOUR_ORG_ID" sign-in="/sign_in"></sa-register>
    <p class="page-note">Already have an account? <a href="/sign_in">Sign in</a></p>
  </main>
</body>
</html>
